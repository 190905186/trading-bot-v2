[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-bot-v2"
version = "0.1.0"
description = "Modular trading platform foundation with event contracts."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "python-dotenv>=1.0",
  "fastapi",
  "uvicorn",
  "redis",
  "psutil",
  "kiteconnect",
  "NorenRestApiOAuth",
  "smartapi-python",
  "logzero",
  "pyotp",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
